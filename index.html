<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 큰 흰 카드 -->
    <section class="sheet resume">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="section-label">ABOUT ME</p>

        <div class="photo" id="profile-photo"></div>

        <h1 class="name" id="profile-name"></h1>
        <p class="job-title" id="profile-title"></p>
        <p class="badge" id="profile-badge"></p>

        <ul class="contact">
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span id="contact-name"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </span>
            <span id="contact-email"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span id="contact-phone"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <span id="contact-location"></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h2 class="big-title">PORTFOLIO</h2>

        <p class="headline" id="profile-headline"></p>
        <p class="intro" id="profile-intro"></p>

        <div class="facts">
          <div class="fact">
            <p class="fact-label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m8.5 13.9-1.5 7.1 5-3 5 3-1.5-7.1"/></svg>
              CERTIFICATIONS
            </p>
            <p class="fact-text" id="profile-education"></p>
          </div>
          <div class="fact">
            <p class="fact-label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
              SPECIALTY
            </p>
            <p class="fact-text" id="profile-skills"></p>
          </div>
          <div class="fact">
            <p class="fact-label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
              EXPERIENCE
            </p>
            <p class="fact-text" id="profile-experience"></p>
          </div>
        </div>

        <div class="highlights">
          <p class="highlights-title">추천 상품</p>
          <div class="cards" id="cards">
            <p class="notice">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="profile-quote"></blockquote>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>

      <div class="guest-form">
        <input type="text" id="guest-nickname" maxlength="20" placeholder="별명 (20자까지)">
        <input type="text" id="guest-message" maxlength="200" placeholder="한마디 남겨 주세요 (200자까지)">
        <button type="button" id="guest-submit" class="primary-button">남기기</button>
      </div>
      <p class="form-message" id="guest-status"></p>

      <ul class="guest-list" id="guest-list">
        <li class="notice">불러오는 중…</li>
      </ul>
    </section>

    <footer class="site-footer">
      <a class="text-link" href="admin.html">관리자</a>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
